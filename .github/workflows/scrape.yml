name: Scrape electricity balance

on:
  schedule:
    # Every 2 hours at minute 5 (UTC).
    - cron: "5 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape-electricity-balance
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip requests
          python -m pip install curl_cffi || echo "::warning::curl_cffi install failed; requests-only fallback will be used."

      - name: Show network route
        env:
          SCRAPE_PROXY_URL: ${{ secrets.SCRAPE_PROXY_URL }}
        run: |
          if [ -n "$SCRAPE_PROXY_URL" ]; then
            echo "Using the configured SCRAPE_PROXY_URL for the balance request."
          else
            echo "No SCRAPE_PROXY_URL configured; using the runner's direct egress."
          fi

      - name: Fetch balance
        env:
          SCRAPE_PROXY_URL: ${{ secrets.SCRAPE_PROXY_URL }}
        run: python scrape.py

      - name: Commit updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No balance change to commit."
            exit 0
          fi
          git commit -m "chore: update electricity balance"
          git push origin "HEAD:${DEFAULT_BRANCH}"
